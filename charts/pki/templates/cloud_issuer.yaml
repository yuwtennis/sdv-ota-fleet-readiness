apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-issuer
spec:
  acme:
    server: {{ .Values.issuer.acme.productionServer}}
    email: {{ .Values.issuer.acme.email }}
    profile:  tlsserver
    privateKeySecretRef:
      name: letsencrypt-secret
    solvers:
      - dns01:
          cloudDNS:
            project: {{ .Values.google.project }}
