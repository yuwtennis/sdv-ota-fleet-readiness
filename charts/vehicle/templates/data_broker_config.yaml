apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
data:
  mosquitto.conf: |
    connection emqx
    address data-broker-listener.sdv.yuwlab.com:8883
    topic state out 1 out/ vehicles/vehicle-ebd0f954-082a-438d-beea-0850826d5908/
    cleansession true

    remote_clientid vehicle-ebd0f954-082a-438d-beea-0850826d5908
    start_type automatic
    notifications false
    log_type all
    listener 1883
    allow_anonymous true
    log_timestamp_format %Y-%m-%dT%H:%M:%S
    log_type all
    try_private true

    bridge_insecure false
    bridge_protocol_version mqttv50
    bridge_tls_use_os_certs true
    bridge_certfile /mosquitto/tls/tls.crt
    bridge_keyfile /mosquitto/tls/tls.key