apiVersion: apps.emqx.io/v3beta1
kind: EMQX
metadata:
  name: emqx
spec:
  image: emqx/emqx:6.3.3
  config:
    roots:
      license:
        key: "evaluation"
      listeners:
        ssl:
          default:
            bind: "0.0.0.0:8883"
            ssl_options:
              cacertfile: "/mounted/client/ca.crt"
              certfile: "/mounted/server/tls.crt"
              keyfile: "/mounted/server/tls.key"
              gc_after_handshake: true
              handshake_timeout: "5s"
              verify: "verify_peer"
              fail_if_no_peer_cert: true
      mqtt:
        peer_cert_as_clientid: cn
  coreTemplate:
    spec:
      resources:
        requests:
          cpu: "500m"
          memory: "512Mi"
        limits:
          cpu: "1000m"
          memory: "1024Mi"
      persistentVolumeClaimSpec:
        ## more information about storage classes: https://cloud.google.com/kubernetes-engine/docs/concepts/persistent-volumes#storageclasses
        storageClassName: standard
        resources:
          requests:
            storage: 10Gi
        accessModes:
          - ReadWriteOnce
      extraVolumes:
        - name: cloud-data-broker-tls
          secret:
            secretName: cloud-data-broker-tls
        - name: vehicle-ca
          secret:
            secretName: vehicle-ca
      extraVolumeMounts:
        - name: cloud-data-broker-tls
          mountPath: /mounted/server
        - name: vehicle-ca
          mountPath: /mounted/client
  dashboardServiceTemplate:
    spec:
      ## more information about load balancer: https://cloud.google.com/kubernetes-engine/docs/how-to/internal-load-balancing
      type: ClusterIP
  listenersServiceTemplate:
    spec:
      ## more information about load balancer: https://cloud.google.com/kubernetes-engine/docs/how-to/internal-load-balancing
      type: LoadBalancer
      loadBalancerIP: {{ $.Values.emqxListener.loadBalancerIP }}
      loadBalancerSourceRanges:
        {{- range $.Values.emqxListener.loadBalancerSourceRanges }}
        - {{ . | quote }}
        {{- end }}

